name: Verify baseline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NG_CLI_ANALYTICS: "false"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: docker compose up -d --wait db
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            apps/api/coverage
            apps/web/coverage
          retention-days: 7
      - run: docker compose down
        if: always()
