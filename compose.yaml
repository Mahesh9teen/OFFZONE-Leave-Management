name: leave-management

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leave_user}
      POSTGRES_DB: ${POSTGRES_DB:-leave_management}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup first}
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    stop_grace_period: 60s
    build:
      context: .
      target: api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-leave_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-leave_management}
      AUTH_SECRET: ${AUTH_SECRET:?Run npm run setup first}
      APP_ORIGIN: ${DOCKER_APP_ORIGIN:-http://localhost:8085}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_LOGIN_ENABLED: ${DEMO_LOGIN_ENABLED:-false}
      SEED_PASSWORD: ${SEED_PASSWORD:?Run npm run setup first}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      JOBS_ENABLED: ${JOBS_ENABLED:-true}
      JOBS_POLL_MS: ${JOBS_POLL_MS:-60000}
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - node apps/api/dist/db/cli.js migrate && node apps/api/dist/main.js
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:${WEB_PORT:-8085}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
